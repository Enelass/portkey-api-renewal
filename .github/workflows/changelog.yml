name: Changelog

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate changelog
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate CHANGELOG.md
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if not changelog.startswith("# Changelog"):
              raise SystemExit("CHANGELOG.md must start with '# Changelog'")
          if "## [Unreleased]" not in changelog:
              raise SystemExit("CHANGELOG.md must contain an [Unreleased] section")
          releases = re.findall(r"^## \[(\d+\.\d+\.\d+)\] - \d{4}-\d{2}-\d{2}$", changelog, re.M)
          if not releases:
              raise SystemExit("CHANGELOG.md must contain at least one dated semantic version section")
          print(f"Validated CHANGELOG.md with {len(releases)} release section(s).")
          PY
